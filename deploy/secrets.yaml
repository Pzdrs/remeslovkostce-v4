---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: database 
  namespace: remeslovkostce
spec:
  secretStoreRef:
    name: vault-prod
    kind: ClusterSecretStore
  target:
    name: database
  data:
    - secretKey: DATABASE_USERNAME
      remoteRef:
        key: prod/remeslovkostce/strapi/database
        property: username
    - secretKey: DATABASE_PASSWORD
      remoteRef:
        key: prod/remeslovkostce/strapi/database
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: s3 
  namespace: remeslovkostce
spec:
  secretStoreRef:
    name: vault-prod
    kind: ClusterSecretStore
  target:
    name: s3
  data:
    - secretKey: S3_ACCESS_KEY
      remoteRef:
        key: prod/remeslovkostce/strapi/s3
        property: access_key
    - secretKey: S3_SECRET_KEY
      remoteRef:
        key: prod/remeslovkostce/strapi/s3
        property: secret_key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: system
  namespace: remeslovkostce
spec:
  secretStoreRef:
    name: vault-prod
    kind: ClusterSecretStore
  target:
    name: system
  data:
    - secretKey: APP_KEYS
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: app_keys
    - secretKey: API_TOKEN_SALT
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: api_token_salt
    - secretKey: ADMIN_JWT_SECRET
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: admin_jwt_secret
    - secretKey: TRANSFER_TOKEN_SALT
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: transfer_token_salt
    - secretKey: ENCRYPTION_KEY
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: encryption_key
    - secretKey: JWT_SECRET
      remoteRef:
        key: prod/remeslovkostce/strapi
        property: jwt_secret